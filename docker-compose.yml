services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cogdrift
      POSTGRES_USER: cogdrift
      POSTGRES_PASSWORD: dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  ingestion-api:
    build: ./service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - rabbitmq
    env_file:
      - .env
    volumes:
      - ./service:/app
      - ./data:/app/data

  drift-worker:
    build: ./service
    command: python -m app.worker
    depends_on:
      - postgres
      - rabbitmq
    env_file:
      - .env
    volumes:
      - ./service:/app
      - ./data:/app/data

volumes:
  pgdata:
